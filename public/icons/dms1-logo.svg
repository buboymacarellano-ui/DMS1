<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="480" height="200" role="img" aria-label="DMS1 Dealership Management System logo">
  <title>DMS1 - Dealership Management System</title>
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091d33"/>
      <stop offset="50%" stop-color="#0e3256"/>
      <stop offset="100%" stop-color="#0a233c"/>
    </linearGradient>

    <!-- Subtle center lighting glow -->
    <radialGradient id="softGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#246ca8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0e3256" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing car silhouette line gradient (Cyan -> White peak -> Cyan) -->
    <linearGradient id="carLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d7ac7" stop-opacity="0.7"/>
      <stop offset="28%" stop-color="#38bdf8"/>
      <stop offset="48%" stop-color="#ffffff"/>
      <stop offset="68%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Subtle inner waist streak gradient -->
    <linearGradient id="waistGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="100" fill="url(#bgGrad)"/>
  <rect width="240" height="100" fill="url(#softGlow)"/>

  <!-- Main aerodynamic roofline silhouette -->
  <path d="M 18 63
           C 28 50, 52 38, 78 34
           C 98 28, 120 22, 142 22
           C 166 22, 186 31, 197 42
           C 208 50, 218 57, 226 64"
        fill="none"
        stroke="url(#carLineGrad)"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Secondary waist / shoulder accent line -->
  <path d="M 88 41 Q 116 38 144 40"
        fill="none"
        stroke="url(#waistGrad)"
        stroke-width="1.6"
        stroke-linecap="round"/>

  <!-- Primary brand text: DMS in bold white, 1 in electric cyan -->
  <text x="120" y="70"
        text-anchor="middle"
        font-family="Montserrat, Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="900"
        font-size="31"
        letter-spacing="0.5">
    <tspan fill="#ffffff">DMS</tspan><tspan fill="#38bdf8">1</tspan>
  </text>

  <!-- Subtitle: DEALERSHIP MANAGEMENT SYSTEM -->
  <text x="120" y="86"
        text-anchor="middle"
        font-family="Montserrat, Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="700"
        font-size="8"
        letter-spacing="2.4"
        fill="#ffffff">DEALERSHIP MANAGEMENT SYSTEM</text>